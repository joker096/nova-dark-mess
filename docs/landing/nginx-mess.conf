# фрагмент для server {} mess.cvr.name
gzip on;
gzip_comp_level 6;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

# brotli on; brotli_types text/css application/javascript image/svg+xml;   # если собран модуль

location = /index.html {
    add_header Cache-Control "no-cache";
}

location ~* \.(glb|webp|png|svg|woff2)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /assets/ {
    add_header Cache-Control "public, max-age=2592000";   # phone3d.js без хеша в имени — переименуйте при обновлении
}

# MIME type for .glb — add via map in http{} block (see below), not types{} here!
# types { model/gltf-binary glb; }  ← NEVER DO THIS in server{} — it REPLACES all MIME types

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;