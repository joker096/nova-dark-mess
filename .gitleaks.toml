# ============================================================================
# gitleaks configuration for CI secret scanning.
# Docs: https://github.com/gitleaks/gitleaks#configuration
#
# gitleaks ships built-in default rules (generic high-entropy strings,
# AWS/GCP/Azure keys, GitHub tokens, Slack, private keys, etc.). This file
# only adds allowlists so standard test vectors and placeholder values do
# not produce false positives.
# ============================================================================

[allowlist]
    description = "Allowlisted files and patterns (test vectors, placeholders)"

    # Files that intentionally contain test vectors or placeholder values.
    paths = [
        # Crypto unit tests use standard RFC 5487 / 7292 test vectors
        '''(src/lib/crypto/.*)\.test\.ts$''',
        # e2e / test harness fixtures
        '''(src/test/.*)$''',
        # The example env file contains only placeholders (CHANGE_ME / <...>)
        '''\.env\.example$''',
        # Cargo lockfile contains package checksums, not secrets
        '''src-tauri/Cargo\.lock$''',
    ]

    # Placeholder values that must never be treated as a leak
    regexes = [
        '''CHANGE_ME.*''',
        '''<your-anon-key>''',
        '''<paymento_.*>''',
        '''<cloudflare_.*>''',
        '''MY_APP_URL''',
        # Test fixture key and device-link alphabet
        '''AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=''',
        '''ABCDEFGHJKLMNPQRSTUVWXYZ23456789''',
    ]

