name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ --ext .ts,.tsx

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # ── Secret scanning ──────────────────────────────────────────────────
      # Fail the build if a secret (passwords, API keys, tokens, private
      # keys, etc.) is present in the files this PR/push changes. This is a
      # second line of defense alongside GitHub Push Protection.
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v1.18.0
        with:
          # Scan the working tree (the files in this checkout), not the
          # full git history. gitleaks applies the [allowlist] rules from
          # .gitleaks.toml to suppress false positives.
          command: detect
          # --no-git: scan the working tree, not history.
          # --exit-code 1: fail the build (and thus the PR) on any finding.
          flags: --no-git --source . --config .gitleaks.toml --exit-code 1
          # Fail the build on any finding.
          report: true
