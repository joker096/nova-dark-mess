name: CI

on:
  # Every branch, not just master: work happens on long-lived feature branches
  # and regressions there used to stay invisible until merge.
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx --sbom-type=application > dependency-sbom.cdx.json

      # The dependency tree that ships (server.js runtime deps) must be clean.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      # Build/test tooling still reports the unpatched picomatch ReDoS
      # (GHSA via vite/tinyglobby/@typescript-eslint). No fixed release exists
      # yet, so it is reported but does not block the build. Remove
      # continue-on-error once picomatch publishes a patched 4.x.
      - name: Audit build-time dependencies (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ --ext .ts,.tsx

      - name: Run tests
        run: npx vitest run

      # Locale drift used to be invisible: DOM checks were "passing" while
      # t('x.y') keys were missing from every bundle. This steps fails on that.
      - name: i18n audit
        run: npm run audit:i18n

      - name: Check Android icon safe zone
        run: npm run check:android-icons

      - name: Build
        run: npm run build

      - name: Upload dependency SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-sbom
          path: dependency-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30

      # ── Secret scanning ──────────────────────────────────────────────────
      # Fail the build if a secret (passwords, API keys, tokens, private
      # keys, etc.) is present in the files this PR/push changes. This is a
      # second line of defense alongside GitHub Push Protection.
      #
      # Uses our own scanner (`scripts/check-secrets.js`) rather than the
      # gitleaks action: the latter is a paid/"full history" product for
      # organisation repos, and our script runs the same rule set plus the
      # allowlist below, so CI and `npm run check:secrets` can never disagree.
      - name: Scan for secrets
        run: npm run check:secrets
