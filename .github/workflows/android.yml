name: Android Build & Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (например, 1.0.1)'
        required: true
        default: '1.0.0'
      channel:
        description: 'Канал сборки'
        type: choice
        options: ['release', 'debug']
        default: 'release'

jobs:
  build-android:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc)
        run: npm run lint

      - name: Run tests
        run: npm test -- --run

      - name: Install Android SDK
        shell: pwsh
        run: |
          $sdkRoot = "$env:LOCALAPPDATA\Android\Sdk"
          New-Item -ItemType Directory -Force -Path $sdkRoot | Out-Null
          setx ANDROID_HOME $sdkRoot
          $env:ANDROID_HOME = $sdkRoot
          # Скачать command-line tools если нужно (здесь предполагается, что в образе Windows уже есть Android SDK)
          # Для полной автоматизации раскомментируйте и укажите URL к command-line-tools

      - name: Build Android (AAB/APK)
        shell: pwsh
        env:
          KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = $GITHUB_REF_NAME -replace '^v','' }
          .\scripts\deploy-android.ps1 -Version $version -Channel "${{ github.event.inputs.channel }}" `
            -KeystorePath $env:KEYSTORE_PATH `
            -KeystorePassword $env:KEYSTORE_PASSWORD `
            -KeyAlias $env:KEY_ALIAS `
            -KeyPassword $env:KEY_PASSWORD

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist/android/*
          retention-days: 30
