name: Android Build & Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (например, 1.0.1)'
        required: true
        default: '1.0.0'
      channel:
        description: 'Канал сборки'
        type: choice
        options: ['release', 'debug']
        default: 'release'

jobs:
  build-android:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc)
        run: npm run lint

      - name: Run tests
        run: npm test -- --run

      - name: Install Android SDK
        shell: pwsh
        run: |
          $sdkRoot = "$env:LOCALAPPDATA\Android\Sdk"
          New-Item -ItemType Directory -Force -Path $sdkRoot | Out-Null
          setx ANDROID_HOME $sdkRoot
          $env:ANDROID_HOME = $sdkRoot
          # Скачать command-line tools если нужно (здесь предполагается, что в образе Windows уже есть Android SDK)
          # Для полной автоматизации раскомментируйте и укажите URL к command-line-tools

      - name: Prepare Android upload key
        if: ${{ github.event.inputs.channel != 'debug' }}
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH_SECRET: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $path = $env:ANDROID_KEYSTORE_PATH_SECRET
          if ($env:ANDROID_KEYSTORE_BASE64) {
            $path = Join-Path $env:RUNNER_TEMP 'android-upload.jks'
            $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64.Trim())
            [IO.File]::WriteAllBytes($path, $bytes)
            Write-Host "Decoded upload keystore to $path"
          }
          if (-not $path -or -not (Test-Path -LiteralPath $path)) {
            throw "Android upload keystore not found. Set ANDROID_KEYSTORE_BASE64 (recommended) or a valid ANDROID_KEYSTORE_PATH."
          }
          if (-not $env:ANDROID_KEYSTORE_PASSWORD) { throw "ANDROID_KEYSTORE_PASSWORD is not set." }
          if (-not $env:ANDROID_KEY_ALIAS) { throw "ANDROID_KEY_ALIAS is not set." }
          if (-not $env:ANDROID_KEY_PASSWORD) { throw "ANDROID_KEY_PASSWORD is not set." }
          "ANDROID_KEYSTORE_PATH=$path" >> $env:GITHUB_ENV

      - name: Build Android (AAB/APK)
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = $GITHUB_REF_NAME -replace '^v','' }
          $channel = "${{ github.event.inputs.channel }}"
          if (-not $channel) { $channel = 'release' }
          .\scripts\deploy-android.ps1 -Version $version -Channel $channel

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist/android/*
          retention-days: 30
