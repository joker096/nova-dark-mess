name: iOS Build & Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (например, 1.0.1)'
        required: true
        default: '1.0.0'

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc)
        run: npm run lint

      - name: Run tests
        run: npm test -- --run

      - name: Install CocoaPods
        run: |
          brew install cocoapods || true
          pod setup --silent || true

      - name: Build iOS (IPA)
        shell: pwsh
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = $GITHUB_REF_NAME -replace '^v','' }
          .\scripts\deploy-ios.ps1 -Version $version -Channel release

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: dist/ios/*
          retention-days: 30
