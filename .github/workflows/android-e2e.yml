name: Android E2E (emulator)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-e2e.yml'
      - 'scripts/android-e2e.mjs'
      - 'src-tauri/**'
      - 'src/lib/network/**'
      - 'src/lib/p2p/mediaCall.ts'
      - 'src/components/ProfileScreen.tsx'

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Android SDK
        # The runner image already ships the Android SDK and cmdline-tools.
        # android-actions/setup-android@v3 currently fails on the image because
        # it asks sdkmanager for the removed legacy `tools` package, so use the
        # preinstalled SDK directly.
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK not found at $SDK_ROOT" >&2
            exit 1
          fi
          SDKMANAGER=$(command -v sdkmanager || true)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -n 1)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          "$SDKMANAGER" --version
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android platform, build-tools and NDK
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.0.12077973" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # The Gradle Rust plugin knows all four ABIs; install them so a
          # `--target x86_64` build cannot fail on a missing std.
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install dependencies
        run: npm ci

      - name: Build Android debug APK (x86_64)
        run: |
          rm -rf src-tauri/gen/android/.gradle src-tauri/gen/android/build src-tauri/gen/android/app/build
          npx tauri android build --apk --debug --target x86_64

      - name: Locate APK
        # Depending on the Tauri/Gradle version the debug build lands either in
        # apk/x86_64/debug/ or as a single apk/universal/debug/ APK. Both run
        # on the x86_64 emulator, so accept either and prefer the ABI-specific
        # one when it exists.
        run: |
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -path '*x86_64*debug*' -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name 'app-*-debug.apk' | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "Debug APK not found" >&2
            find src-tauri/gen/android/app/build/outputs -type f >&2 || true
            exit 1
          fi
          echo "ANDROID_APK=$APK_PATH" >> "$GITHUB_ENV"
          echo "Using $APK_PATH"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: ${{ env.ANDROID_APK }}
          retention-days: 7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android end-to-end checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
            -camera-back virtualscene -camera-front emulated
          script: node scripts/android-e2e.mjs
