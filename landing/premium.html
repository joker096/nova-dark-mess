<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Premium — Mess&Anger</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .premium-box { max-width: 560px; margin: 60px auto; padding: 24px; background: #151621; border: 1px solid rgba(255,255,255,.08); border-radius: 20px; color: #fff; }
    .license { font-family: monospace; font-size: 12px; word-break: break-all; background: #0b0c14; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.06); margin: 12px 0; }
    .status { font-size: 13px; color: #868b98; margin-bottom: 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { padding: 10px 16px; border-radius: 10px; border: 0; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #7c5cff; color: #fff; }
    .btn-ghost { background: rgba(255,255,255,.06); color: #fff; }
  </style>
</head>
<body>
  <main class="premium-box">
    <h1>Premium activation</h1>
    <p class="status" id="status">Checking payment status…</p>
    <div id="licenseBlock" style="display:none;">
      <p>Your license key (paste it in the app → Settings → Premium → Activate):</p>
      <div class="license" id="licenseKey"></div>
      <div class="row">
        <button class="btn btn-ghost" id="copyKey">Copy key</button>
        <a class="btn btn-primary" id="openApp" href="#">Open in app</a>
      </div>
    </div>
    <div id="pendingBlock" style="display:none;">
      <p>Payment is still being confirmed. This page will update automatically.</p>
    </div>
    <div id="errorBlock" style="display:none;">
      <p id="errorMsg"></p>
      <a href="index.html#download" class="btn btn-ghost">Back to download</a>
    </div>
  </main>
  <script>
    (function () {
      'use strict';
      var params = new URLSearchParams(location.search);
      var orderId = params.get('order') || (function () { try { return sessionStorage.getItem('nova_premium_order'); } catch (e) { return null; } })();
      function deviceId() {
        try {
          var k = 'nova_premium_device';
          var v = localStorage.getItem(k);
          if (!v) { v = 'dev-' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem(k, v); }
          return v;
        } catch (e) { return 'dev-' + Date.now().toString(36); }
      }

      var statusEl = document.getElementById('status');
      var licenseBlock = document.getElementById('licenseBlock');
      var pendingBlock = document.getElementById('pendingBlock');
      var errorBlock = document.getElementById('errorBlock');
      var licenseEl = document.getElementById('licenseKey');
      var copyBtn = document.getElementById('copyKey');
      var openApp = document.getElementById('openApp');

      if (!orderId) {
        statusEl.textContent = 'No order id found.';
        errorBlock.style.display = 'block';
        document.getElementById('errorMsg').textContent = 'Open this page from the checkout button.';
        return;
      }

      async function poll() {
        try {
          var res = await fetch('/api/premium/order/' + encodeURIComponent(orderId) + '?device=' + encodeURIComponent(deviceId()));
          var data = await res.json();
          if (!res.ok) throw new Error(data.error || 'request failed');
          if (data.status === 'paid' && data.license) {
            statusEl.textContent = 'Payment confirmed. Premium is ready.';
            licenseEl.textContent = data.license;
            licenseBlock.style.display = 'block';
            pendingBlock.style.display = 'none';
            openApp.href = 'messanger://premium?license=' + encodeURIComponent(data.license);
            return true;
          }
          statusEl.textContent = 'Waiting for payment confirmation…';
          pendingBlock.style.display = 'block';
          return false;
        } catch (err) {
          statusEl.textContent = 'Error checking status.';
          errorBlock.style.display = 'block';
          document.getElementById('errorMsg').textContent = String(err && err.message ? err.message : err);
          return true;
        }
      }

      poll().then(function (done) {
        if (!done) {
          var iv = setInterval(function () {
            poll().then(function (d) { if (d) clearInterval(iv); });
          }, 3000);
        }
      });

      copyBtn.addEventListener('click', function () {
        var t = licenseEl.textContent;
        if (navigator.clipboard) navigator.clipboard.writeText(t);
        copyBtn.textContent = 'Copied';
        setTimeout(function () { copyBtn.textContent = 'Copy key'; }, 1500);
      });
    })();
  </script>
</body>
</html>
