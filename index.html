<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="no-referrer" />
    <title>Nova Dark Messenger</title>
    <meta name="description" content="High-fidelity dark luxury messenger design system with interactive chat, channel feed, profile, and component tokens." />
    <meta property="og:title" content="Nova Dark Messenger" />
    <meta property="og:description" content="High-fidelity dark luxury messenger design system with interactive chat, channel feed, profile, and component tokens." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/icons/icon-dark.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64" />
    <link rel="apple-touch-icon" href="/icons/icon-dark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      window.__novaErrs = [];
      window.addEventListener('error', function (e) {
        window.__novaErrs.push('ERR:' + (e.message || '') + '|' + (e.error && e.error.stack ? String(e.error.stack).slice(0, 1500) : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__novaErrs.push('REJ:' + String((e.reason && e.reason.stack) || e.reason).slice(0, 1500));
      });
      (function () {
        var orig = console.error;
        console.error = function () {
          var parts = [];
          for (var i = 0; i < arguments.length; i++) {
            var a = arguments[i];
            parts.push(String((a && a.stack) || a));
          }
          window.__novaErrs.push('CERR:' + parts.join(' ').slice(0, 1500));
          orig.apply(console, arguments);
        };
      })();
    </script>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('nova_app_theme') || 'system';
          var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var t = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[var(--nova-accent-color)]/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
