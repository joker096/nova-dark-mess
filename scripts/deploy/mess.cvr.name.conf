server {
    listen 80;
    server_name mess.cvr.name;

    location /.well-known/acme-challenge/ {
        root /var/www/mess.cvr.name/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mess.cvr.name;

    ssl_certificate /etc/letsencrypt/live/mess.cvr.name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mess.cvr.name/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/mess.cvr.name/landing;
    index index.html;

    # Privacy policy (Google Play requirement) — static, no rewrite games.
    location = /privacy.html {
        try_files $uri =404;
    }
    location = /privacy {
        return 301 /privacy.html;
    }

    # API (PaymentO IPN, receipts, health) -> node server.js.
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
